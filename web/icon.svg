<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 26">
  <!-- The ember, as an icon: the same flame path the app draws, in Forge's amber. Literal colours on
       purpose — an icon sits in a tab strip or a taskbar, where no palette reaches it. -->
